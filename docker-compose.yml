# AXT-Term deployment.
#
#   cp .env.example .env
#   mkdir -p secrets
#   openssl rand -base64 32 > secrets/axt_master_key
#   chown 10001:10001 secrets/axt_master_key && chmod 600 secrets/axt_master_key
#   docker compose up -d
#   docker compose exec axt-term axt-admin user create --username admin
#
# That serves the UI over plain HTTP at http://<server-ip>:8081 with no proxy in
# front. Set AXT_PUBLIC_URL in .env to the same address: cookie security and the
# accepted WebSocket origin are both derived from it.
#
# For TLS on a hostname instead:
#
#   docker compose --profile tls up -d
#
# Three services and no more. guacd exists because browsers cannot speak RDP and
# something must translate; there is deliberately no cache and no message broker,
# because neither would add a capability this application lacks.

name: axt-term

services:
  axt-term:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${AXT_VERSION:-dev}
    image: axt-term:${AXT_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      AXT_HTTP_ADDR: ":8080"
      AXT_DATA_DIR: /var/lib/axt-term
      AXT_MASTER_KEY_FILE: /run/secrets/axt_master_key
      # guacd is reachable only on the internal network below.
      AXT_GUACD_ADDR: guacd:4822
      # Empty by default, because with the port published directly there is no
      # proxy in front. Trusting X-Forwarded-For from a direct client would let it
      # forge the address recorded in the audit log and sidestep per-IP rate
      # limiting. The tls profile below needs AXT_TRUSTED_PROXIES=172.28.0.0/16.
      AXT_TRUSTED_PROXIES: ${AXT_TRUSTED_PROXIES:-}
    volumes:
      - axt-data:/var/lib/axt-term
    secrets:
      - axt_master_key
    networks:
      - edge
      - internal
    # Published on the host so the UI is reachable at http://<server-ip>:8081
    # without a proxy. Override AXT_PORT if that port is taken -- the host's 8080 is
    # a common conflict -- and keep AXT_PUBLIC_URL in .env in step with it.
    #
    # This is plain HTTP: session cookies cannot carry the Secure attribute, so
    # credentials cross the network in clear text. Reasonable on a trusted LAN, not
    # across one you do not control; use the tls profile there.
    ports:
      - "${AXT_PORT:-8081}:8080"
    # Still exposed for the tls profile, where Caddy reaches the app over the
    # internal network rather than through the published port.
    expose:
      - "8080"
    depends_on:
      guacd:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    # The application writes only to its data volume, so the rest of the
    # filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Apache Guacamole's proxy daemon: the RDP and VNC translation layer.
  #
  # Never published. Credentials are decrypted inside axt-term and sent to guacd
  # across this private network, so the browser never holds them.
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    environment:
      GUACD_LOG_LEVEL: ${GUACD_LOG_LEVEL:-info}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS termination, behind the `tls` profile. Not started by default: the app is
  # reachable on its own published port without it. Enable it whenever the traffic
  # leaves a network you trust -- on plain HTTP the Secure cookie attribute cannot
  # be used, and passwords and session tokens travel in clear text.
  caddy:
    image: caddy:2.8-alpine
    # Opt-in: `docker compose --profile tls up -d`. Without the profile Caddy never
    # starts and the app is served straight from the published port above.
    profiles:
      - tls
    restart: unless-stopped
    ports:
      - "${AXT_HTTP_PORT:-80}:80"
      - "${AXT_HTTPS_PORT:-443}:443"
    environment:
      AXT_DOMAIN: ${AXT_DOMAIN:-axt-term.local}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      axt-term:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Reachable from the host through Caddy's published ports.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # No gateway: guacd cannot reach the internet, and nothing outside can reach it.
  internal:
    driver: bridge
    internal: true

volumes:
  # The database, host-key trust store, and session recordings. This is the only
  # stateful thing to back up -- plus the master key, which must be stored
  # SEPARATELY, because a backup containing both is a backup of your plaintext
  # secrets.
  axt-data:
  caddy-data:
  caddy-config:

secrets:
  axt_master_key:
    file: ./secrets/axt_master_key
