<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark: an A whose crossbar extends right into a chevron, with a cursor
    underscore beneath. Drawn to stay legible at 16px, which most logos are not.
  -->
  <rect width="32" height="32" rx="6" fill="#0b0d0f" />
  <path d="M7 23 L13 9 L19 23" stroke="#e6edf3" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M10.2 18 H21.5 L25 21" stroke="#22d3ee" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round" />
  <rect x="20" y="24" width="6" height="2.5" rx="1.25" fill="#22d3ee" />
</svg>
